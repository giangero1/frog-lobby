name: Bug report
description: Report a reproducible defect in Frog Lobby
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem.

        **Security vulnerability? Do not put exploit details here.**
        Follow `SECURITY.md` and use private vulnerability reporting when available.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest safe set of steps needed to reproduce the issue.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node version, deployment platform, relay/direct mode, and relevant non-secret configuration.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove access tokens, session tickets, private keys, secrets, and personal data before posting.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed credentials, tokens, private keys, and personal data.
          required: true
        - label: This is not a security vulnerability requiring private disclosure.
          required: true
